name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ssl:verify-certificate no;
            open ftp://mar60036:$FTP_PASSWORD@162.241.60.233;
            mirror -R --delete \
              --exclude-glob .git \
              --exclude-glob .github \
              01-design/sites/2026-05-30-v4/ /public_html/;
            quit
          "
